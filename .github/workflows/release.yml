name: Release

# Publish a GitHub release when an implementation's version tag is pushed:
# c/v1.2.3 for the C project in c/, cpp/v1.2.3 for the C++ project in cpp/.
# Each implementation is versioned on its own, and the tag must match the
# VERSION in its CMakeLists.txt.
#
# The release notes are the tag's message (git tag -a), or GitHub's generated
# notes for a tag without one. The implementation's assignment PDF, if it has
# one, is attached.
#
# A release created by hand in the GitHub UI also pushes its tag; in that case
# the release is kept as written and only the PDF is attached.

on:
  push:
    tags: ['c/v*', 'cpp/v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04

    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The checkout can leave the tag pointing straight at the commit; fetch
      # the tag object itself so an annotated tag's message can be read.
      - name: Fetch the tag
        run: git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"

      - name: Check the tag matches the project version
        run: |
          project=${TAG%%/*}
          version=$(sed -n 's/^ *VERSION \([0-9][0-9.]*\)$/\1/p' "$project/CMakeLists.txt" | head -n 1)
          if [ "$TAG" != "$project/v$version" ]; then
              echo "::error::Tag $TAG does not match VERSION $version in $project/CMakeLists.txt"
              exit 1
          fi

      - name: Publish the release
        run: |
          project=${TAG%%/*}
          case $project in
          c) name=C ;;
          cpp) name=C++ ;;
          *) name=$project ;;
          esac
          title="graph-matching $name ${TAG#*/v}"

          assets=()
          if [ -f "$project/docs/assignment.pdf" ]; then
              assets+=("$project/docs/assignment.pdf")
          fi

          if gh release view "$TAG" > /dev/null 2>&1; then
              if [ ${#assets[@]} -gt 0 ]; then
                  gh release upload "$TAG" "${assets[@]}" --clobber
              fi
          elif [ "$(git cat-file -t "$TAG")" = tag ]; then
              gh release create "$TAG" "${assets[@]}" --title "$title" --notes-from-tag
          else
              gh release create "$TAG" "${assets[@]}" --title "$title" --generate-notes
          fi
